name: Verify government reference portfolio

on:
  push:
    branches: [main]
    paths:
      - 'govlab/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'references/**'
      - 'Dockerfile'
      - 'requirements.lock'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'govlab/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'references/**'
      - 'Dockerfile'
      - 'requirements.lock'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  government-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch immutable shared research source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cybersmeashish/sovereign-disconnected-cloud-security
          ref: 747cf5428daa12a7b89126011a9f64accf4154af
          path: .upstream
          persist-credentials: false
      - name: Install hash-locked dependencies
        run: python -m pip install --no-cache-dir --require-hashes -r requirements.lock
      - name: Prepare and verify reference source
        run: python -m tools.prepare_reference --checkout .upstream
      - name: Run government regression cases
        run: python -m unittest discover -s tests -v
      - name: Validate mission and flow declarations
        run: python -m tools.validate_registers examples/government-register.json
      - name: Prepare pinned image without build networking
        run: |
          docker pull python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          python -m tools.prepare_reference --checkout .upstream --wheels --architecture amd64
          docker build --network=none --pull=false -t ashish-government:contributions-01-24 .
      - name: Verify isolated government cases
        run: python -m tools.run_isolated_lab --output evidence/ci/government-report.json
      - name: Retain measured reference evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: government-reference-evidence
          path: evidence/ci/*.json
          retention-days: 14
